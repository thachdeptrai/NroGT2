name: Build & Release Unity iOS IPA

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version release (vd: v1.0.0)"
        required: true
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Xcode version
        run: xcodebuild -version

      - name: Build iOS without signing
        run: |
          xcodebuild \
            -project Unity-iPhone.xcodeproj \
            -scheme Unity-iPhone \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Create unsigned IPA
        run: |
          APP_PATH=$(find build/DerivedData/Build/Products/Release-iphoneos \
            -maxdepth 1 \
            -name "*.app" \
            -type d | head -1)

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: Không tìm thấy file .app"
            exit 1
          fi

          echo "Found app: $APP_PATH"

          mkdir -p build/ipa/Payload
          cp -R "$APP_PATH" build/ipa/Payload/

          cd build/ipa
          zip -r "../NRO-${{ inputs.version }}-unsigned.ipa" Payload

          echo "IPA:"
          ls -lh "../NRO-${{ inputs.version }}-unsigned.ipa"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NRO-${{ inputs.version }}
          path: build/NRO-${{ inputs.version }}-unsigned.ipa
          retention-days: 7

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          name: NRO ${{ inputs.version }}
          generate_release_notes: true
          files: |
            build/NRO-${{ inputs.version }}-unsigned.ipa