name: Build Unity iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Xcode version
        run: xcodebuild -version

      - name: Build iOS without signing
        run: |
          xcodebuild \
            -project Unity-iPhone.xcodeproj \
            -scheme Unity-iPhone \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Find app
        run: |
          echo "===== BUILD PRODUCTS ====="
          find build/DerivedData/Build/Products -name "*.app" -type d -maxdepth 4

      - name: Create unsigned IPA
        run: |
          APP_PATH=$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" -type d | head -1)

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: Không tìm thấy .app"
            exit 1
          fi

          echo "Found app: $APP_PATH"

          mkdir -p build/ipa/Payload
          cp -R "$APP_PATH" build/ipa/Payload/

          cd build/ipa
          zip -r "../NRO-unsigned.ipa" Payload

          echo "===== IPA CREATED ====="
          ls -lh ../NRO-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: NRO-iOS-IPA
          path: build/NRO-unsigned.ipa
          retention-days: 7